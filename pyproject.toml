[project]
name = "devin-e2e-orchestrator"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "httpx>=0.27", "uvicorn[standard]>=0.29", "pydantic>=2"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["E501"]

[tool.setuptools.packages.find]
include = ["app*"]
